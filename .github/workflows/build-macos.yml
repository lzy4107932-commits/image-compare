name: Build macOS test package

on:
  push:
    branches:
      - codex/macos-version
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build and smoke-test Apple Silicon package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: npm run check

      - name: Smoke-test Electron
        run: npm run smoke:electron

      - name: Build ad-hoc-signed macOS ARM64 packages
        run: npm run electron:build:mac

      - name: Verify application signature
        run: codesign --verify --deep --strict --verbose=2 "release/mac-arm64/图片对比工具.app"

      - name: Smoke-test packaged application
        run: npm run smoke:packaged

      - name: Add installation guide to downloads
        run: cp MACOS_INSTALL.txt release/MACOS_INSTALL.txt

      - name: Create checksums
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt

      - name: Upload macOS test package
        uses: actions/upload-artifact@v4
        with:
          name: Image-Compare-${{ steps.package.outputs.version }}-macOS-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            release/MACOS_INSTALL.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.dmg
          release/*.zip
          release/SHA256SUMS.txt
          release/MACOS_INSTALL.txt
          --title "图片对比工具 $GITHUB_REF_NAME"
          --generate-notes
