name: Publish Windows release package

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-windows-release.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build and publish Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Smoke-test Electron
        run: npm run smoke:electron

      - name: Build Windows x64 installer
        run: npm run electron:build:win

      - name: Smoke-test packaged application
        run: npm run smoke:packaged

      - name: Create Windows checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter "Image-Compare-1.2.0-Windows-x64-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath release/WINDOWS_SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-Compare-1.2.0-Windows-x64
          path: |
            release/Image-Compare-1.2.0-Windows-x64-Setup.exe
            release/WINDOWS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Add Windows installer to v1.2.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload v1.2.0
          release/Image-Compare-1.2.0-Windows-x64-Setup.exe
          release/WINDOWS_SHA256SUMS.txt
          --clobber
